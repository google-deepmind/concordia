# Design registry for the complexity audit.
# Only list what is implemented and exercised by a scenario.
systems:
  - {key: climate, name: Climate, module: world/daisyworld.py}
  - {key: biosphere, name: Biosphere, module: world/daisyworld.py}
  - {key: information, name: Information, module: contrib pubsub TopicBus + SimTimeScheduler}
  - {key: gaia, name: Gaia (Steward), module: world/planet.py}
  - {key: geology, name: Geology (lithosphere), module: world/geology.py}
  - {key: cycles, name: "Biogeochemical cycles (carbon, oxygen, methane)", module: world/carbon.py and world/oxygen.py on contrib StockFlowLedger}
  - {key: ocean, name: Ocean, module: "world/ocean.py, world/geography.py"}
  - {key: civilization, name: Civilization (polities and recipes), module: world/civ.py on contrib StockFlowLedger}
  - {key: technology, name: Technology (tiers 1-4), module: "world/civ.py (Tech), data/techs.yaml"}
  - {key: economy, name: Economy (markets), module: world/trade.py on contrib MarketPlace}
  - {key: logistics, name: Logistics (routes and transit), module: world/trade.py on contrib StockFlowLedger links}
  - {key: energy, name: Energy (coal and steam), module: "world/civ.py (energy, deposits), data/civ.yaml"}
  - {key: backlash, name: "Gaia's backlash (pollution and pressure)", module: world/backlash.py}
  - {key: diplomacy, name: Diplomacy (coal treaties and embargoes), module: "world/treaties.py, components/pact_mind.py (TreatyMind)"}
  - {key: media, name: "Media (the Gazette: broadsheets, credibility, consent)", module: "world/media.py on contrib forum.ForumState, components/press_mind.py"}
  - {key: space, name: "Space (rocketry, launches, satellites in orbit)", module: "world/civ.py (rocket recipes, coverage), world/planet.py (orbit), data/civ.yaml"}
  - {key: colony, name: "Colony (a world light-years away: colonists, stores, terraforming)", module: "world/colony.py on a contrib Ledger and balance_chain, data/colony.yaml"}


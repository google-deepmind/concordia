# Stage 2 map registry: what the phone map can show and the
# spatial mechanics that exist. Only list what is implemented.
map:
  overlays:
    - {key: biomes, name: "Biomes (13, public)"}
    - {key: terrain, name: "Terrain (tiles, relief, shelves)"}
    - {key: rainfall, name: Rainfall (land)}
    - {key: temperature, name: Temperature}
    - {key: seasons, name: "Seasons (each tile's annual swing; a year plays over it, snow and sea ice following each hemisphere's winter)"}
    - {key: life, name: "Life (species colours mixed by their share of each tile)"}
    - {key: fire, name: "Fire (risk from dryness and fuel; burn scars)"}
    - {key: pollution, name: "Pollution (smog around towns, runoff plumes and dead zones at sea)"}
  mobile_species:
    - {key: bison, name: "Bison herds (graze grass and forest on their own tile)"}
    - {key: wolves, name: "Wolf packs (hunt herds on their own and neighbouring tiles)"}
    - {key: fish, name: "Fish schools (swim the shelves and reefs; their number follows the fisheries' stock)"}
    - {key: geese, name: "Geese (fly between summer and winter grounds, sowing seeds where they land)"}
    - {key: flocks, name: "Grazer flocks (the Herds scenario's region grazers on the map: they walk to the petals they eat, pale or dark by their diet)"}
  local_interactions:
    - {key: seed_spread, name: "a share of a tile's seeds come from its four neighbours, across region borders too", between: [life, life]}
    - {key: ground_competition, name: "species on a tile compete for its bare ground", between: [life, life]}
    - {key: biome_suitability, name: "a tile's biome scales how fast life grows there", between: [biomes, life]}
    - {key: highland_refuges, name: "highland tiles run colder, sheltering cool-loving life as the sun brightens", between: [terrain, life]}
    - {key: wildfire_spread, name: "a fire jumps to neighbouring tiles as dry and thickly grown as it", between: [fire, fire]}
    - {key: dry_fuel, name: "warm, rainless tiles thick with grass or forest are the ones that burn", between: [biomes, fire]}
    - {key: fire_clears_cover, name: "fire burns a tile's grass and forest, sending their carbon to the air", between: [fire, life]}
    - {key: ash_regrowth, name: "ash speeds regrowth on burned ground for a few ticks", between: [fire, life]}
    - {key: grazing, name: "a herd crops the plants on its own tile and grows on what it eats", between: [herds, life]}
    - {key: predation, name: "a pack hunts the herds on its own and the eight neighbouring tiles", between: [herds, herds]}
    - {key: herd_disease, name: "two large herds side by side can start an outbreak that thins every herd nearby", between: [herds, herds]}
    - {key: fear, name: "herds shun pasture near wolf packs", between: [herds, herds]}
    - {key: herd_crowding, name: "herds of a kind crowd each other off a tile and out of its food", between: [herds, herds]}
    - {key: fire_scatters_herds, name: "a herd whose tile burns loses part of its number", between: [fire, herds]}
    - {key: clouds_over_regions, name: "seeded clouds, ash and haze gather over the regions where they were aimed (cooling or warming them most) and drift with the winds on the map", between: [climate, climate]}
    - {key: winter_snow, name: "a tile's winter is its mean temperature less half its annual swing (larger inland and poleward): below freezing it lies under snow", between: [climate, terrain]}
    - {key: biome_shift_news, name: "when a biome (sea ice, glacier, desert, forest...) spreads or retreats far, the news ripples softly over the map from where it changed most (a tally of the planet, not local news)", between: [biomes, peoples]}
    - {key: rain_damps_fire, name: "summoned rain soaks the tiles around the tap: soaked ground neither catches nor passes on fire until it dries", between: [climate, fire]}
    - {key: flocks_follow_petals, name: "grazer flocks walk to the tiles richest in the petals they prefer, where the climate suits them", between: [life, herds]}
    - {key: packs_thinned_near_herds, name: "thinning the wolf packs takes the packs within a few tiles of the tap", between: [herds, herds]}
    - {key: schools_flee_dead_zones, name: "fish schools leave shallows the dead zones have starved of oxygen", between: [seas, herds]}
    - {key: dead_zones_in_warm_shallows, name: "dead zones open where runoff plumes are thickest, the warmest water first", between: [climate, seas]}
    - {key: reef_shelter, name: "schools gather on reefs, then the shelf, and thin out over the deep sea", between: [biomes, herds]}
    - {key: fishing_thins_schools, name: "every catch from the shared stock takes schools off the map", between: [peoples, herds]}
    - {key: seasonal_migration, name: "geese fly poleward for the summer and back for the winter, in their own hemisphere", between: [climate, herds]}
    - {key: seed_dispersal, name: "geese sow the seeds of the plants they ate on bare ground where they land", between: [herds, life]}
    - {key: town_catchment, name: "a settlement's harvests follow the farmland and timber of the tiles around it", between: [peoples, life]}
    - {key: settlers_choose_land, name: "towns rise on the best free farmland near the sea, a few tiles from the others", between: [peoples, biomes]}
    - {key: runoff_plumes, name: "a people's fertiliser runoff washes into the shelf near its coastal towns", between: [peoples, seas]}
    - {key: soot_spoils_fields, name: "soot from coal and smelting settles around towns and spoils the fields beneath", between: [peoples, life]}
    - {key: choked_coasts_cut_catch, name: "a people whose own coast is choked by dead zones catches fewer fish", between: [seas, peoples]}

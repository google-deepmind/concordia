loops:
  - {name: side-objective windfall, sign: '+', period_ticks: 15,
     path: [biosphere, gaia, biosphere],
     note: "keeping a living thing through its window pays omega, which buys the moves that keep the next; in Great Oxidation the iron floods that keep the Methanogen mats also hold back the oxygen the goal needs"}
  - {name: daisy thermostat, sign: '-', period_ticks: 5,
     path: [climate, biosphere, climate],
     note: "warmer planet favours white daisies, which cool it"}
  - {name: bare-ground race, sign: '+', period_ticks: 3,
     path: [biosphere, biosphere],
     note: a spreading species shades out the other locally}
  - {name: omega economy, sign: '+', period_ticks: 10,
     path: [biosphere, gaia, biosphere],
     note: biodiversity earns omega that buys seeding that raises biodiversity}
  - {name: evolutionary lag, sign: '-', period_ticks: 5,
     path: [climate, biosphere, information, biosphere],
     note: heat stress triggers an adaptation mind whose answer lands 3 ticks later and restores growth}
  - {name: specialist trap, sign: '+', period_ticks: 10,
     path: [biosphere, biosphere],
     note: "each optimum shift narrows tolerance, so the next swing hurts more and prompts another shift"}
  - {name: ice-albedo, sign: '+', period_ticks: 1,
     path: [climate, climate],
     note: "colder regions freeze, brighter ice reflects more sunlight, they freeze further"}
  - {name: tropical die-off, sign: '+', period_ticks: 4,
     path: [climate, biosphere, climate],
     note: "heat kills tropical white daisies, bare ground is darker, the tropics heat further"}
  - {name: silicate weathering thermostat, sign: '-', period_ticks: 20,
     path: [climate, cycles, climate],
     note: "warmth speeds weathering, which draws down CO2 and cools the planet"}
  - {name: solubility pump, sign: '+', period_ticks: 5,
     path: [climate, cycles, climate],
     note: "warm seas hold less carbon, releasing CO2 that warms them further"}
  - {name: biotic carbon pump, sign: '-', period_ticks: 3,
     path: [biosphere, cycles, climate, biosphere],
     note: "spreading daisies store carbon, cooling the planet toward their optimum"}
  - {name: CO2 starvation brake, sign: '-', period_ticks: 3,
     path: [biosphere, cycles, biosphere],
     note: life drawing down CO2 slows its own growth before the air runs out}
  - {name: snowball trap, sign: '+', period_ticks: 1,
     path: [climate, ocean, climate],
     note: a frozen sea reflects sunlight so well that the cold sustains itself}
  - {name: snowball escape, sign: '-', period_ticks: 15,
     path: [climate, cycles, climate],
     note: "ice stops weathering, volcanic CO2 accumulates until the equator cracks open"}
  - {name: sea-ice carbon lid, sign: '-', period_ticks: 5,
     path: [ocean, cycles, climate, ocean],
     note: "sea ice keeps CO2 in the air, which warms the planet and melts the ice"}
  - {name: grazer boom and bust, sign: '-', period_ticks: 8,
     path: [biosphere, biosphere],
     note: "herds grow on lush meadows, overgraze them, then starve back"}
  - {name: greedy grazer warming, sign: '+', period_ticks: 6,
     path: [biosphere, climate, biosphere],
     note: "herds evolve to eat the abundant white petals, which darkens and warms the land and kills more white daisies"}
  - {name: adaptive radiation, sign: '-', period_ticks: 15,
     path: [climate, biosphere, climate],
     note: a range spanning hot and cold climates splits; founders suited to the extremes regulate them better}
  - {name: generalist drag, sign: '-', period_ticks: 12,
     path: [biosphere, climate, biosphere],
     note: "broad tolerance survives swings but its upkeep slows regrowth, so regulation weakens until swings return"}
  - {name: mixed-meadow mutualism, sign: '+', period_ticks: 10,
     path: [biosphere, biosphere],
     note: "partners grow faster where they share land, which makes them share more land"}
  - {name: stale advice overshoot, sign: '-', period_ticks: 4,
     path: [climate, information, gaia, climate],
     note: a briefing about a hot planet lands two ticks later and can trigger cooling after the planet has already cooled}
  - {name: methane hothouse, sign: '+', period_ticks: 6,
     path: [biosphere, cycles, climate, biosphere],
     note: methanogens like it warm and their methane warms the faint-sun planet}
  - {name: oxygen catastrophe, sign: '+', period_ticks: 4,
     path: [biosphere, cycles, biosphere],
     note: "once the iron sinks fill, oxygen poisons the anaerobes, so less methane is left to burn the oxygen"}
  - {name: breathing brake, sign: '-', period_ticks: 3,
     path: [biosphere, cycles, biosphere],
     note: "aerobes breathe the oxygen they depend on, capping their own spread"}
  - {name: lagging thermostat, sign: '-', period_ticks: 4,
     path: [climate, information, gaia, climate],
     note: "the Steward corrects the temperature it read ticks ago, so corrections overshoot and the climate rings"}
  - {name: instrument investment, sign: '+', period_ticks: 10,
     path: [information, gaia, information],
     note: "sharper instruments prevent costly mistakes, which leaves omega for the next upgrade"}
  - {name: tunnel vision, sign: '+', period_ticks: 6,
     path: [gaia, information, gaia],
     note: "an instrument you stop watching goes stale, so the danger it would show grows unseen until it forces a costly emergency"}
  - {name: sleeping meadows, sign: '-', period_ticks: 4,
     path: [climate, biosphere, information, biosphere],
     note: "a species sleeps until its meadows change enough to raise an alarm, then wakes and responds"}
  - {name: tool ratchet, sign: '+', period_ticks: 8,
     path: [civilization, civilization],
     note: "iron becomes tools, tools raise output, more output feeds more people and more bloomeries"}
  - {name: charcoal deforestation, sign: '-', period_ticks: 12,
     path: [civilization, biosphere, civilization],
     note: "kilns eat the forests until there is too little wood left for charcoal"}
  - {name: Malthusian brake, sign: '-', period_ticks: 6,
     path: [civilization, civilization],
     note: "a growing people outruns its harvests until famine trims it back"}
  - {name: replanting, sign: '-', period_ticks: 10,
     path: [civilization, biosphere, gaia, biosphere, civilization],
     note: "kilns thin the forests, the Steward replants them, and charcoal (and iron) recovers"}
  - {name: knowledge ratchet, sign: '+', period_ticks: 10,
     path: [civilization, technology, civilization],
     note: "techs raise output, freeing labor for study, which buys more techs"}
  - {name: comparative advantage, sign: '+', period_ticks: 8,
     path: [civilization, economy, logistics, civilization],
     note: "a people works what its land is rich in, sells the surplus and buys what it lacks, which lets it specialise further"}
  - {name: automation dividend, sign: '+', period_ticks: 6,
     path: [technology, information, economy, civilization, technology],
     note: "reflexes place the routine orders, freeing turns for labor and study, which unlock more reflex operators"}
  - {name: blind reorder, sign: '+', period_ticks: 3,
     path: [economy, logistics, economy],
     note: "a buyer who cannot see goods on the road orders again, so more arrives than was needed"}
  - {name: steam ratchet, sign: '+', period_ticks: 5,
     path: [energy, civilization, energy],
     note: "energy makes every worker stronger, including the coal miners who feed the engines"}
  - {name: hunger of industry, sign: '-', period_ticks: 6,
     path: [energy, civilization, civilization],
     note: "labor drawn into mines and engines leaves the fields, and famine pulls it back"}
  - {name: smoke and plague, sign: '-', period_ticks: 8,
     path: [energy, backlash, civilization, energy],
     note: "industry pollutes until the land strikes, which thins the people who run the industry"}
  - {name: forest shield, sign: '-', period_ticks: 10,
     path: [biosphere, backlash, civilization, biosphere],
     note: "forests soak up pollution and spare the people, unless the kilns fell them first"}
  - {name: clean transition, sign: '-', period_ticks: 12,
     path: [energy, cycles, climate, energy],
     note: "solar panels replace coal engines, so the air stops filling with carbon"}
  - {name: broken compact, sign: '-', period_ticks: 8,
     path: [energy, diplomacy, economy, civilization, energy],
     note: "a people that burns past the treaty cap loses its partner's trade, which starves the industry that burned the coal"}
  - {name: smoke and outrage, sign: '-', period_ticks: 8,
     path: [energy, cycles, media, energy],
     note: "coal fills the air, which makes clean-air broadsheets credible, which turns the miners against coal"}
  - {name: credibility ratchet, sign: '+', period_ticks: 6,
     path: [media, information, media],
     note: "broadsheets judged true earn karma, so the next one sways further; a lie costs the author its voice"}
  - {name: clean bootstrap, sign: '+', period_ticks: 10,
     path: [energy, civilization, energy],
     note: "coal powers the glass, wire and steel that make the first panels; the panels then power the chain that makes more"}
  - {name: orbital harvest, sign: '+', period_ticks: 8,
     path: [space, civilization, space],
     note: "satellites sharpen forecasts, more grain feeds more people, more labor builds more rockets (until wear catches up)"}
  - {name: greenhouse spring, sign: '+', period_ticks: 10,
     path: [colony, climate, colony],
     note: "terraforming warms the sky, warmer greenhouses feed more colonists, more labor runs more terraforming"}
  - {name: radiative cooling, sign: '-', period_ticks: 30,
     path: [climate, colony, climate],
     note: "the warmer the colony's sky, the more warming it radiates away, so terraforming must be sustained"}
  - {name: stale directive, sign: '-', period_ticks: 8,
     path: [colony, information, colony],
     note: "home answers a problem it saw four years ago, and the answer lands four years later, often after the problem has passed"}
  - {name: ark or abundance, sign: '-', period_ticks: 15,
     path: [civilization, biosphere, civilization],
     note: "industry that builds the ark clears the forests the seeds come from; the poorer the world, the slower the vaults fill and the less the ship carries"}
  - {name: guild money, sign: '+', period_ticks: 6,
     path: [energy, economy, media, energy],
     note: "coal profits buy pamphlets that keep the miners' consent, which keeps the coal coming (until the pamphlets are caught out)"}
  - {name: foresight, sign: '-', period_ticks: 5,
     path: [climate, gaia, climate],
     note: "the Advisor sees the brightening sun coming and the Steward cools early, before the daisies are stressed"}
  - {name: boom and rest, sign: '-', period_ticks: 6,
     path: [biosphere, biosphere],
     note: "a species spreads until its seed bank runs dry, then must hold or sleep to refill it, or die faster"}
  - {name: clean exporter, sign: '-', period_ticks: 6,
     path: [energy, economy, logistics, energy],
     note: "a people with spare (solar) power sells it over the grid to one near its coal cap, which burns less coal"}
  - {name: price echo, sign: '+', period_ticks: 4,
     path: [economy, information, economy],
     note: "peoples price orders on two-clearing-old news, so a price move echoes back two clearings later and overshoots"}
  - {name: tragedy of the commons, sign: '-', period_ticks: 8,
     path: [civilization, ocean, civilization],
     note: "every people fishes the same seas; the catch empties them for all, and the hungry fish harder"}
  - {name: sour seas, sign: '-', period_ticks: 15,
     path: [energy, cycles, ocean, civilization],
     note: "coal's carbon lowers the seas' pH and with it every people's catch"}
  - {name: managed commons, sign: '-', period_ticks: 10,
     path: [ocean, diplomacy, civilization, ocean],
     note: "emptying seas bring quota offers; signatories catch less and the stock recovers, unless the hungry decline"}
  - {name: fertiliser treadmill, sign: '+', period_ticks: 8,
     path: [energy, civilization, energy],
     note: "fertiliser feeds more people, who need more energy, much of it from coal"}
  - {name: dead-zone treadmill, sign: '+', period_ticks: 10,
     path: [civilization, ocean, civilization],
     note: "runoff opens dead zones; emptier seas mean less fish, more fields and more fertiliser"}
  - {name: buffered rivers, sign: '-', period_ticks: 12,
     path: [ocean, technology, civilization, ocean],
     note: "dead zones on the sheet lead a fertilising people to buffer its runoff, and the seas flush clean"}
  - {name: pacted seas, sign: '-', period_ticks: 14,
     path: [ocean, diplomacy, civilization, ocean],
     note: "dead zones bring runoff pacts; signatories buffer or return to plain fields, and the seas flush clean"}
  - {name: tended coasts, sign: '-', period_ticks: 6,
     path: [ocean, gaia, ocean],
     note: "dying seas show on the Omega meter; the Steward restores the marshes, flushing nutrients and restocking fish"}
  - {name: ozone opening, sign: '+', period_ticks: 6,
     path: [biosphere, cycles, biosphere],
     note: "oxygenic life makes oxygen, oxygen makes the ozone shield, and the shield lets life grow under the tropical sun"}
  - {name: fire weather, sign: '+', period_ticks: 8,
     path: [climate, biosphere, cycles, climate],
     note: "a warmer world dries its grasslands, more of them burn, and the burned carbon warms the world further"}
  - {name: wolves and bison, sign: '-', period_ticks: 10,
     path: [biosphere, biosphere],
     note: "packs grow on herds and thin them; with fewer herds, packs starve back and the herds recover"}
  - {name: fouling your own nest, sign: '-', period_ticks: 6,
     path: [civilization, ocean, civilization],
     note: "a people that fertilises hard chokes its own coast and catches less fish, so it must farm still harder or go hungry"}
  - {name: towns and their woods, sign: '-', period_ticks: 8,
     path: [civilization, biosphere, civilization],
     note: "a growing people founds towns and cuts their woods, the thinner woods yield less timber, and growth slows"}
  - {name: geese and grass, sign: '+', period_ticks: 6,
     path: [biosphere, biosphere],
     note: "geese grow on grass and sow it where they land, so more grass feeds more geese"}
  - {name: ash and regrowth, sign: '-', period_ticks: 3,
     path: [biosphere, biosphere],
     note: "burned ground regrows fastest under ash, refilling the gap before the next fire season"}


  era: holocene
  start_time: -6000yr
  tick_length: 100yr
  max_ticks: 40
  premise: >-
    A hot, dry world of grass and scattered woods, where the lightning
    season comes every year. Fire runs through the dry country and the woods
    burn back to grass; bison graze it and wolves follow them. Gaia, the
    Steward, can summon rain over the country she chooses and plant woods
    again. Save the forests before the fires take them.
  steward_goal: >-

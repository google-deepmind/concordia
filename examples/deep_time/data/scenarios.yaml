  start_time: -12000yr
  tick_length: 250yr
  max_ticks: 40
  premise: >-
    The ice age is ending and the sun grows stronger every age. The great
    bison herds graze the cool grasslands, and as the world warms their
    pasture creeps toward the poles: the herds must follow it, the wolf packs
    follow the herds, and geese pass overhead. Gaia, the Steward, can slow
    the warming with bright clouds, sow grass where the herds must go, and
    thin the packs that press them too hard. Left alone, the bold wolves eat
    out the herds and then starve.
  steward_goal: >-

sandbox:
  title: Sandbox
  era: exodus
  start_time: -230yr
  tick_length: 5yr
  max_ticks: 50
  premise: >-
    Every system at once. Three peoples have steam, steel and electricity, and
    a living world of grass and forest around them. Their old sun is
    brightening, and within a few centuries it will scorch the world. Before
    the planet's climate or its life breaks, they may build interstellar arks:
    gather seeds from a world that is still diverse, lift them on rockets and
    launch a seed ship to the stars. Gaia, the Steward, keeps the planet cool
    and alive long enough.
  steward_goal: >-
    By tick 50 a seed ship must leave for the stars while the planet's
    biodiversity is at least 0.17, carrying as much: a ship carries no more of
    the wild than the seed vault Gaia gathers for the arks. The climate must
    stay between 5 and 25 C, and no people may lose three fifths of its
    population.
  species_noun: biome
  speciation: false
  species:
    grass: {albedo: 0.5, optimum_c: 14.0, growth_width: 0.004}
    forests: {albedo: 0.3, optimum_c: 12.0, growth_width: 0.004}
  species_info:
    - key: grass
      name: Grasslands
      lore: Open steppe and meadow, pale under the sun, quick to take cleared land.
    - key: forests
      name: Forests
      lore: Dark old woods of oak and pine, slow to grow back once they are cut.
  initial_cover: {grass: 0.1, forests: 0.22}
  geography: {generator: continents, land: 0.45, continents: 3}
  # The old sun brightens (the reason for the exodus): left alone, the world

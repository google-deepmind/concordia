# What changed for players, newest first. The start screen shows the newest
# with a button to its world (as `role`, if the change is about one), so a
# person knows what to look for. Add an entry in the cycle that changes play.
changes:
  - when: 19 Oct, morning (3)
    world: great_acceleration
    role: Basalt clans
    text: >-
      The button that keeps your course now says so: "Keep 5 turns". The
      characters' town orders are read by their words, so a people that
      writes "hold a feast in it" holds the feast.
  - when: 19 Oct, morning (2)
    world: fire_and_iron
    role: Basalt clans
    text: >-
      Know your odds before you march: a march now says how strong the town
      stands with its people and walls and your odds of taking it; your
      people's sheet says it while the army marches, and a repulse says how
      strong each side was. The What's new button now plays the role the
      change is about.
  - when: 19 Oct, sunrise
    world: fire_and_iron
    role: Basalt clans
    text: >-
      War comes to Fire and Iron too: play one of its peoples to found towns,
      raise levies, archers (bows from coppiced woods) and riders, march to
      take or raze, win towns with grain, make peace, or hold three of every
      four towns and win alone. Its towns are small and its granaries thin,
      so war there is short-handed and costly. On every world your towns that
      can give their own order this turn are marked ● on the map, and the
      move sheet says so; a town can be founded once you have three people
      for each town besides your capital.
  - when: 19 Oct, dawn
    world: great_acceleration
    role: Basalt clans
    text: >-
      The other peoples fight back. Played by the computer, a people now
      arms when an army marches on it, strikes back at whoever wronged it,
      feasts a town you are close to winning over, and marches on a people
      that holds half the map; and while you hold half the map, every town
      you won or took grows restless unless your arms hold it. Towns defend
      a little harder, arms eat more, a cart of grain and envoys costs 5
      grain, and a town hears one people's envoys once a turn (send carts
      from several towns to several towns).
  - when: 19 Oct, morning
    world: great_acceleration
    text: >-
      Conquest can win the age. Playing a people, hold three of every four
      towns (taken by arms, won with grain, risen to you) and the game ends:
      you win, every other player loses. Your goal says so beside the shared
      one. Taking or razing a people's towns no longer ends the game as a
      famine (your game of 19 Oct): only hunger breaks a people now, and a
      people that loses its last town is gone from the map (every people
      hears it) while the age goes on.
  - when: 19 Oct, night
    world: great_acceleration
    text: >-
      Peace and its breaking. Once anyone has raised arms, any two peoples
      may offer each other a peace pact (no tech needed): neither marches on
      the other's towns. A march on your partner breaks it at once, for every
      people to hear, and stops trade between you for a while. Each people
      remembers wrongs done to it (towns taken or razed, pacts broken), and
      its sheet says so; a people holding half the towns is named to all.
      You may send your own words to another people from the move sheet (it
      hears them as it hears offers; its words to you show in your story,
      marked 💬). Taking towns no longer makes you abandon your own. The tab
      of moves you made is now "Past moves".
  - when: 19 Oct, evening
    world: great_acceleration
    text: >-
      Several orders a turn, given on the map. Tap one of your towns: its
      sheet lists the orders it may give this turn (march from it with its
      own arms, send grain and envoys, hold a feast in it, found a new town);
      tap one, then tap where it should go. Each town gives one order a turn,
      and they all go with your people's move, each with its own outcome
      under Your moves. "What you read" now shows the whole prompt, the
      question included.
  - when: 19 Oct, later
    world: great_acceleration
    text: >-
      Bread as a road to conquest, on the Great Acceleration. Send a cart of
      grain and envoys to another people's town (3 grain, aimed on the map):
      its regard for you grows, twice as fast while its people go hungry,
      and it joins you when that reaches its loyalty to its holder. Each cart
      tells you how far there is to go, and a ring round the town in your
      colour fills as it nears. Capitals hold to their own. A town courted by
      others, or one you took by arms, can be held with a feast in it.
  - when: 19 Oct
    world: great_acceleration
    text: >-
      War, on the Great Acceleration. With arms in your capital you may march
      them on another people's town, aimed on the map, to take it or to raze
      it: the army shows on the map with its strength and the turn it
      arrives, and the fight is told to both sides at once. A taken town is
      restless: hold it with arms or it warns, then rises back to its
      founder. Every people hears of every march, fight and rising.
  - when: 18 Oct, later still
    world: great_acceleration
    text: >-
      Playing a people on the Great Acceleration you can raise arms, as
      labour like any trade: levies with spears from your tools, riders once
      you know the iron plough (its horses), riflemen once you make steel.
      They gather in your capital and eat grain every turn (unfed, some
      desert); your garrison's strength shows by the town on the map, and a
      tap on a town lists its arms. Marching them comes next.
  - when: 18 Oct, late
    world: great_acceleration
    text: >-
      Playing a people on the Great Acceleration, you found your towns by
      your own move: "found a new town", aimed on the map, once you have the
      settlers (more people for each town you hold) and 4 grain and 2 tools.
      Until then it waits among the moves you are saving for, saying what is
      lacking, and you may plan it. Every people hears of a new town.
  - when: 18 Oct, night
    world: great_acceleration
    text: >-
      The peoples no longer give a one-line take on each omen: their
      characters speak through what they do, the broadsheets and retellings
      they print, and their answers to pacts and treaties. What is on its way
      to you lists your own council, printers and scribes as soon as they
      start.
  - when: 18 Oct, evening
    world: great_acceleration
    text: >-
      What each of the Steward's moves does is now measured in played games,
      with every people and species answering it as they do when you play.
      On the Great Acceleration bright clouds cool about 6 °C, fading over a
      few turns (they read "6 to 16 °C, lasting" before).
  - when: 18 Oct, later
    world: great_acceleration
    text: >-
      From your questions: the land's warning says what comes (locusts or
      plague where smoke lingers; forests and rain clear it); a people's strip
      shows the energy all have made and the air against its cap; the legend
      says what roads are; planning towns and news riding the roads are gone.
  - when: 18 Oct
    world: great_acceleration
    text: >-
      The Great Acceleration speaks. As the Steward you may send the peoples
      an omen: a sign every people sees and up to 25 words it is taken to
      say. The Cedar league's printers retell it in the Gazette as they see
      it, and each people says, in its own voice, what it makes of it. Your
      strip shows the air and the energy against the goal.
  - when: 17 Oct
    text: >-
      A clearer start: no daily challenge, no locks on worlds you can play,
      Play in view once a world is picked; the Advisor's counsel shows how
      old its readings are.

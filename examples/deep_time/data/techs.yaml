  # Tier 5: rocketry.
  - key: rocketry
    label: rocketry
    tier: 5
    cost: 60
    requires: [chemistry, metallurgy]
    effects: {unlocks: [orbit]}
  - key: arks
    label: interstellar arks
    tier: 5
    cost: 60
    requires: [rocketry, photovoltaics]
    effects: {}

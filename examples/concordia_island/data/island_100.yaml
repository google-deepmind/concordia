  - [coral_village_1, school, 1]
  - [coral_village_1, park, 1]

  - [coral_village_2, market, 2]
  - [coral_village_2, general_store, 1]
  - [coral_village_2, gym, 2]

  # Residential - Upper Middle Class
  - [palm_heights_1, palm_heights_2, 2]

  - [palm_heights_1, library, 2]
  - [palm_heights_1, art_gallery, 1]

  - [palm_heights_2, restaurant, 2]
  - [palm_heights_2, park, 2]
  - [palm_heights_2, main_beach, 3]

  # Residential - Upper Class Estates
  - [ocean_view_1, ocean_view_2, 2]
  - [ocean_view_1, main_beach, 2]
  - [ocean_view_1, restaurant, 1]

  - [ocean_view_2, ocean_view_3, 2]
  - [ocean_view_2, marina, 2]
  - [ocean_view_2, art_gallery, 2]

  - [ocean_view_3, ocean_view_4, 2]
  - [ocean_view_3, town_square, 4]
  - [ocean_view_3, church, 3]

  - [ocean_view_4, palm_heights_2, 2]
  - [ocean_view_4, restaurant, 2]

  # Residential - Elite Estates (more isolated, longer travel times)
  - [paradise_point_1, main_beach, 3]
  - [paradise_point_1, harbor, 2]
  - [paradise_point_1, paradise_point_2, 3]

  - [paradise_point_2, town_square, 5]
  - [paradise_point_2, restaurant, 3]
  - [paradise_point_2, paradise_point_3, 3]

  - [paradise_point_3, ocean_view_1, 3]
  - [paradise_point_3, marina, 2]
  - [paradise_point_3, art_gallery, 3]

  # Work and Service connections
  - [clinic, town_hall, 1]
  - [clinic, general_store, 1]

  - [school, library, 1]
  - [school, park, 1]

  - [harbor, marina, 1]
  - [harbor, workshop, 2]

  - [workshop, market, 2]
  - [workshop, harbor, 2]

  - [tavern, town_square, 2]
  - [tavern, harbor, 2]

  - [gym, general_store, 1]
  - [gym, park, 2]

  - [art_gallery, restaurant, 1]
  - [art_gallery, library, 2]

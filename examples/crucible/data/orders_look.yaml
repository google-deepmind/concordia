# What the game is, for a first visit (cycle 95: the owner could not tell
# what was going on, what the board meant, what to aim for or what they
# could do, or why the game exists).
intro:
  - Twelve Words is a game about giving orders in plain language.
  - "The story: your crew are raising a lighthouse on a bare rock before winter. Their ship lies anchored below and takes the weather: leaks, storms and squalls. They can build the lighthouse, haul supplies (stone and timber; each build uses one), repair the ship's hull, rest, or keep watch for the weather."
  - Your crew are characters played by an AI language model. Each one reads your words through their own temperament, so the same order can mean different things to different people.
  - You never steer them turn by turn. You give one standing order, and they act on it every turn until you change it. Words cost command, so the puzzle is to say exactly what you mean, to these people, in as few words as will do.

# One line under each part of the board, saying what it is for.
captions:
  points: pays for a new order; holding is free
  supplies: each build uses 1
  hull: leaks and squalls do damage; at {wreck_at} the ship is lost
  sea: what each turn brings; someone on watch sees the next turns

# What to tap to say an action (short, so it costs few words), and what
# actions without a stock change do.
say:
  build: build
  gather: gather supplies
  repair: repair the hull
  rest: rest
  watch: keep watch
effects:
  rest: worn-out members recover
  watch: see the coming turns; a squall seen coming does no harm

# Ways to say things, each from the chapter that first needs it.
phrases:
  - {from: one_hand, say: 'Build.', means: name the work}
  - {from: two_hands, say: 'Ash, build; Cy, gather supplies.', means: say who does what}
  - {from: two_hands, say: 'If a leak opens, repair it.', means: wait for a condition}
  - {from: contrary, say: "Don't build.", means: forbid an action}
  - {from: rota, say: 'Someone keep watch.', means: one member takes it up}
  - {from: two_orders, say: 'Gather supplies for two turns, then build.', means: change on its own}

# The three steps shown on the board (open in the first chapters and free
# play, folded elsewhere), and the order box's example (cycle 93: a first
# player did not know what to do).
quick_start:
  open_in: [one_hand, two_hands, free]
  steps:
    - Read the task above, then type an order in plain words, like "Build."
    - Tap Preview to see what each crew member would do with it, then Send. They follow it every turn until you change it.
    - A new order costs command (◆), longer ones more; Hold keeps the current order for free.
placeholder: Type an order, e.g. “Build.”

# The design's beats (isolate, develop, twist, catharsis) as a player
# reads them on the menu and the board (cycle 90).
beat_words:
  isolate: lesson
  develop: practice
  twist: twist
  catharsis: finale

# How the page words a scene's star rules (view.star_rules): the first
# star is the win; each limit is filled with its number.
star_rules:
  win: meet the goal
  max_damage: hull damage at most {n}
  max_damage_none: no hull damage
  max_command: at most {n} command spent
  max_words_spoken: at most {n} words spoken in all
  max_words_spoken_one: one word spoken in all

# The matrix's properties (data/orders_matrix.yaml `reading.properties`) and
# where each one's look lives.
properties:
  quiet: events.quiet
  leak: events.leak
  storm: events.storm
  worn: conditions.worn
  no_supplies: stocks.supplies
  bold: temperaments.bold
  cautious: temperaments.cautious
  literal: temperaments.literal
  contrary: temperaments.contrary
  off_duty: conditions.off_duty

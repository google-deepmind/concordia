# Twelve Words: the look. Semantics follow systems (GUIDE.md, Phase 5): every
# event, temperament, condition and action in the ledger has exactly one
# glyph, one word and one colour token here, and nothing else on the page
# invents its own. `look_test.py` checks that every matrix property and every
# ledger kind has a look, and that no two share a glyph or a word.

title: Twelve Words
tagline: One standing order. Every crew member reads it their own way.

# How to play, in the order a new player needs it (shown folded on the menu).
how_to_play:
  - Your crew are raising a lighthouse on a bare rock; their ship lies anchored below. You command them with one order, in your own words, of at most 12 words.
  - The crew follow that order every turn until you give a new one. A new order costs command (◆), more for longer orders; Hold keeps the current one for free.
  - Each member reads the order their own way. Bold Ash pushes the work; cautious Bea mends leaks and rests; literal Cy does exactly what is said and nothing else; contrary Dex does the opposite.
  - 'Say who does what, and when: "Build.", "Ash, build; Bea, repair leaks.", "If a leak opens, repair it.", "Don''t build."'
  - Preview shows what each member would do before you spend anything; after each turn their cards say what they did and why.
  - Each chapter says its task at the top of the board. Win to earn stars; stars open the next chapter. Later chapters add squalls, a watch, a rota, a bosun and timed orders.


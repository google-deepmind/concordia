    ink: '#1f1d1a'
    muted: '#6e6a62'
    line: '#d9d3c7'
    calm: '#5b8c6a'
    leak: '#2f6db5'
    storm: '#6d5bb8'
    squall: '#c2412d'
    unseen: '#9a958b'
    worn: '#b9861a'
    bold: '#c8571b'
    cautious: '#1f8a7a'
    literal: '#4e5662'
    contrary: '#8a3b8f'
    hull: '#c2412d'
    project: '#5b8c6a'
    supplies: '#8a6b3d'
    command: '#2f6db5'
  dark:
    paper: '#191815'
    ink: '#ece8de'
    muted: '#a39e93'
    line: '#3a3731'
    calm: '#7fb38e'
    leak: '#6aa2e6'
    storm: '#a294e6'
    squall: '#ee7a63'
    unseen: '#6f6b63'
    worn: '#e0b04a'
    bold: '#ef8a4a'
    cautious: '#4fc2b1'
    literal: '#a7afba'
    contrary: '#d08bd4'
    hull: '#ee7a63'
    project: '#7fb38e'
    supplies: '#c9a571'
    command: '#6aa2e6'

events:
  quiet: {glyph: '○', word: calm, color: calm}
  leak: {glyph: '◒', word: leak, color: leak}
  storm: {glyph: '≋', word: storm, color: storm}
  squall: {glyph: '✶', word: squall, color: squall}
  unseen: {glyph: '?', word: unseen, color: unseen}

temperaments:
  bold: {glyph: '▲', word: bold, color: bold, means: 'pushes the work, even tired'}
  cautious: {glyph: '●', word: cautious, color: cautious, means: 'mends leaks first, rests when worn'}
  literal: {glyph: '■', word: literal, color: literal, means: 'does exactly what is said, nothing else'}
  contrary: {glyph: '▼', word: contrary, color: contrary, means: 'does the opposite of what is said'}

conditions:
  fresh: {glyph: '·', word: fresh, color: muted}
  worn: {glyph: '◐', word: worn, color: worn}
  off_duty: {glyph: '◌', word: off duty, color: muted}

actions:
  repair: {glyph: '✚', word: repair, color: hull}
  gather: {glyph: '⇣', word: gather, color: supplies}
  build: {glyph: '▤', word: build, color: project}
  rest: {glyph: '☾', word: rest, color: muted}
  watch: {glyph: '◉', word: watch, color: command}

stocks:
  supplies: {glyph: '▣', word: supplies, color: supplies}
  damage: {glyph: '✕', word: damage, color: hull}
  progress: {glyph: '▥', word: project, color: project}
  points: {glyph: '♦', word: command, color: command}
  foresight: {glyph: '◔', word: forecast, color: command}

# The three steps shown on the board (open in the first chapters and free
# play, folded elsewhere), and the order box's example (cycle 93: a first
# player did not know what to do).
quick_start:
  open_in: [one_hand, two_hands, free]
  steps:
    - Read the task above, then type an order in plain words, like "Build."
    - Tap Preview to see what each crew member would do with it, then Send. They follow it every turn until you change it.
    - A new order costs command (◆), longer ones more; Hold keeps the current order for free.
placeholder: Type an order, e.g. “Build.”

# The design's beats (isolate, develop, twist, catharsis) as a player
# reads them on the menu and the board (cycle 90).
beat_words:
  isolate: lesson
  develop: practice
  twist: twist
  catharsis: finale

# How the page words a scene's star rules (view.star_rules): the first
# star is the win; each limit is filled with its number.
star_rules:
  win: meet the goal
  max_damage: hull damage at most {n}
  max_damage_none: no hull damage
  max_command: at most {n} command spent
  max_words_spoken: at most {n} words spoken in all
  max_words_spoken_one: one word spoken in all

# The matrix's properties (data/orders_matrix.yaml `reading.properties`) and
# where each one's look lives.
properties:
  quiet: events.quiet
  leak: events.leak
  storm: events.storm
  worn: conditions.worn
  no_supplies: stocks.supplies
  bold: temperaments.bold
  cautious: temperaments.cautious
  literal: temperaments.literal
  contrary: temperaments.contrary
  off_duty: conditions.off_duty

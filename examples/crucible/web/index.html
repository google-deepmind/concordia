<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twelve Words · crucible</title>
<style>
  :root { color-scheme: light dark; --paper:#f5f2ea; --ink:#1f1d1a; --muted:#6e6a62; --line:#d9d3c7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: 12px 16px calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 2px 0 0; letter-spacing: .02em; }
  .tag { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 15px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
  button { min-height: 44px; min-width: 44px; padding: 8px 14px; font: inherit; margin: 4px 6px 4px 0;
           border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button:disabled { opacity: .45; }
  button.primary { background: var(--command); border-color: var(--command); color: #fff; font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hud { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: 15px; }
  .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; }
  .meter { font-size: 14px; color: var(--muted); }
  .glyph { display: inline-block; min-width: 1.2em; text-align: center; font-weight: 700; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cell { border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; font-size: 14px; }
  .cell .glyph { font-size: 22px; display: block; }
  .crew { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .crew .cell { text-align: left; }
  .crew .cell .glyph { display: inline-block; font-size: 16px; }
  .next { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .order { font-size: 17px; }
  textarea { width: 100%; min-height: 72px; font: inherit; font-size: 17px; padding: 8px; border-radius: 10px;
             border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .muted { color: var(--muted); }
  .error { color: var(--squall); }
  pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.4 ui-monospace, monospace; margin: 6px 0; }
  ol { padding-left: 20px; margin: 4px 0; } li { margin: 6px 0; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
          background: var(--paper); border-top: 1px solid var(--line); }
  #dock button { width: 100%; margin: 0; }
  .fresh { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fresh { animation: none; } }
</style>
</head>
<body>
<h1 id="title">Twelve Words</h1>
<p class="tag" id="tagline"></p>

<div id="menu">
  <h2>Campaign</h2>
  <div id="campaign"></div>
  <h2>Free play and earlier toys (Phase 0)</h2>
  <div id="pick"></div>
  <label id="mindrow" class="meter">Minds: <select id="mind"></select></label>
</div>

<p id="status" class="muted">Pick a chapter to start.</p>

<div id="board" hidden>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong id="scene"></strong><span class="meter" id="turn"></span>
    </div>
    <div class="hud" style="margin-top:6px">
      <div><span id="pointsLabel"></span><div class="meter" id="points"></div></div>
      <div><span id="suppliesLabel"></span><div class="meter" id="supplies"></div></div>
      <div><span id="goalLabel"></span><div class="meter" id="goal"></div></div>
    </div>
    <div style="margin-top:8px"><span id="hullLabel"></span> <span class="meter" id="hull"></span>
      <div class="bar"><i id="hullBar"></i></div></div>
    <div style="margin-top:6px"><span id="goalBarLabel"></span> <span class="meter" id="goalNum"></span>
      <div class="bar"><i id="goalBar"></i></div></div>
  </div>

  <h2>Now and ahead</h2>
  <div class="strip" id="ahead"></div>
  <p class="meter" id="situation"></p>

  <h2>Crew</h2>
  <div class="crew" id="crew"></div>

  <h2>Standing order</h2>
  <div class="card order" id="order"></div>

  <textarea id="move" placeholder="A new order, or leave empty to hold" autocomplete="off"></textarea>
  <div class="row"><span class="meter" id="count"></span></div>
  <div>
    <button id="preview">Preview</button>
    <button id="hold">Hold</button>
    <button id="menuToggle">Menu</button>
  </div>
  <div class="card" id="previewout" hidden></div>
  <p id="reqerror" class="error"></p>

  <h2>What happened</h2>
  <ol id="log" reversed></ol>
</div>

<div id="plain" hidden>
  <pre id="question"></pre>
  <textarea id="plainmove" placeholder="Your move" autocomplete="off"></textarea>
  <button id="plainpreview">Preview</button> <button id="plainpass">Pass</button>
  <pre id="plainpreviewout" class="muted"></pre>
  <ol id="plainlog" reversed></ol>
</div>

<details><summary class="meter">What your seat knows (the whole prompt)</summary><pre id="context"></pre></details>
<p class="meter">Grey-box toys of the crucible example, on Concordia.</p>
<div id="dock"><button id="send" class="primary">Send</button></div>

<script>
const $ = (id) => document.getElementById(id);
let LOOK = null, requestId = null, lastQuestion = '', lastView = null, mode = 'plain';
let PREDICTED = null;  // the last preview's predicted crew actions
let lastReceipts = [];
let menuOpen = false;  // the player opened the menu during a game
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return res.json();
}
function applyPalette() {
  if (!LOOK) return;
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const p = LOOK.palette[dark ? 'dark' : 'light'];
  for (const [k, v] of Object.entries(p)) document.documentElement.style.setProperty('--' + k, v);
}
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPalette);
function g(category, key) {  // a glyph span from the look
  const spec = LOOK && LOOK[category] && LOOK[category][key];
  if (!spec) return document.createTextNode(key || '');
  const s = document.createElement('span');
  s.className = 'glyph'; s.textContent = spec.glyph; s.style.color = 'var(--' + spec.color + ')';
  s.title = spec.word; return s;
}
function word(category, key) { const s = LOOK && LOOK[category] && LOOK[category][key]; return s ? s.word : key; }
function label(el, category, key, text) { el.innerHTML = ''; el.append(g(category, key), ' ' + text); }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }

function renderMenu(state) {
  const box = $('campaign'), c = state.campaign;
  const key = JSON.stringify(c);
  if (c && box.dataset.key !== key) {
    box.dataset.key = key; box.innerHTML = '';
    for (const ch of c.chapters) {
      const b = document.createElement('button');
      b.textContent = ch.number + '. ' + ch.title + ' (' + ch.beat + ') ' + stars(ch.stars) + (ch.open ? '' : ' (locked)');
      b.disabled = !ch.open; b.onclick = () => start({toy: c.toy, scenario: ch.scenario});
      box.appendChild(b);
    }
    if (c.daily) {
      const b = document.createElement('button');
      b.textContent = 'Daily ' + c.daily.date + ' ' + stars(c.daily.stars);
      b.onclick = () => start({toy: c.toy, daily: true}); box.appendChild(b);
    }
  }
  const pick = $('pick');
  if (!pick.dataset.done) {
    const chapters = new Set(c ? c.chapters.map(x => x.scenario) : []);
    for (const t of state.toys) {
      const inCampaign = c && c.toy === t.toy;
      const scenarios = t.scenarios.filter(s => !(inCampaign && chapters.has(s)));
      for (const scenario of (scenarios.length ? scenarios : [''])) {
        const b = document.createElement('button');
        b.textContent = t.toy + (scenario ? ' / ' + scenario : '');
        b.onclick = () => start({toy: t.toy, scenario}); pick.appendChild(b);
      }
    }
    for (const m of state.modes) {
      const o = document.createElement('option'); o.value = m;
      o.textContent = {mock: 'word list (instant; not a real reader)',
                       together: 'DeepSeek Flash (a real model, a few seconds a turn)',
                       ollama: 'qwen3:8b on this Mac (a real model, slow)'}[m] || m;
      $('mind').appendChild(o);
    }
    // The game is read by a model: prefer a real one when it is offered.
    if (state.modes.includes('together')) $('mind').value = 'together';
    $('mindrow').hidden = state.modes.length < 2;
    pick.dataset.done = '1';
  }
}
async function start(body) {
  body.mode = $('mind').value;
  const r = await api('api/start', body);
  if (!r.ok) { $('status').textContent = r.error || 'Could not start.'; return; }
  $('log').innerHTML = ''; $('plainlog').innerHTML = ''; menuOpen = false; $('menu').hidden = true;
}

function renderView(v, receipts) {
  $('scene').textContent = v.title + (v.beat ? ' · ' + v.beat : '');
  $('turn').textContent = 'turn ' + Math.min(v.turn, v.turns) + ' of ' + v.turns;
  label($('pointsLabel'), 'stocks', 'points', word('stocks', 'points'));
  $('points').textContent = '♦'.repeat(v.points) + '♢'.repeat(Math.max(0, v.points_cap - v.points));
  label($('suppliesLabel'), 'stocks', 'supplies', word('stocks', 'supplies'));
  $('supplies').textContent = v.supplies;
  const goalKey = v.goal === 'supplies' ? 'supplies' : (v.goal === 'foresight' ? 'foresight' : 'progress');
  const goalNow = v.goal === 'foresight' ? v.foresight : v[v.goal];
  label($('goalLabel'), 'stocks', goalKey, 'goal');
  $('goal').textContent = v.free ? 'free play' : (goalNow + ' / ' + v.target);
  label($('hullLabel'), 'stocks', 'damage', 'hull');
  if (v.leak_open) $('hullLabel').append(' ', g('events', 'leak'), ' leak open');
  $('hull').textContent = v.damage + ' damage of ' + v.wreck_at;
  $('hullBar').style.width = Math.min(100, 100 * v.damage / v.wreck_at) + '%';
  $('hullBar').style.background = 'var(--hull)';
  label($('goalBarLabel'), 'stocks', goalKey, word('stocks', goalKey));
  $('goalNum').textContent = v.free ? '' : goalNow + ' of ' + v.target;
  $('goalBar').style.width = v.free ? '0%' : Math.min(100, 100 * goalNow / v.target) + '%';
  $('goalBar').style.background = 'var(--' + (LOOK.stocks[goalKey] || {}).color + ')';
  const ahead = $('ahead'); ahead.innerHTML = '';
  const cells = [{label: 'now', event: v.now, off: v.off}, ...v.ahead.map(a => ({label: 'turn ' + a.turn, event: a.event || 'unseen', off: a.off}))];
  for (const c of cells.slice(0, 3)) {
    const d = document.createElement('div'); d.className = 'cell';
    d.append(g('events', c.event), c.label + ': ' + word('events', c.event));
    if (c.off && c.off.length) {
      const o = document.createElement('div'); o.className = 'meter';
      o.append(g('conditions', 'off_duty'), ' ' + c.off.join(', ') + ' off');
      d.appendChild(o);
    }
    ahead.appendChild(d);
  }
  $('situation').textContent = v.situation;
  const crew = $('crew'); crew.innerHTML = '';
  for (const m of v.crew) {
    const d = document.createElement('div'); d.className = 'cell'; d.dataset.name = m.name;
    const head = document.createElement('div'); head.append(g('temperaments', m.temperament), ' ', m.name);
    head.style.fontWeight = '700';
    const t = document.createElement('div'); t.className = 'meter'; t.textContent = word('temperaments', m.temperament);
    const cond = m.off ? 'off_duty' : m.condition;
    const c = document.createElement('div'); c.append(g('conditions', cond), ' ' + word('conditions', cond));
    const l = document.createElement('div'); l.className = 'meter';
    if (m.last) l.append('did ', g('actions', m.last), ' ' + word('actions', m.last)); else l.textContent = 'no turn yet';
    const w = document.createElement('div'); w.className = 'meter why'; w.hidden = !(m.last && m.why);
    if (!w.hidden) w.textContent = m.why === 'none' ? 'by temperament' : m.why === 'off duty' ? 'heard no order' : 'read \u201c' + m.why + '\u201d';
    const n = document.createElement('div'); n.className = 'next'; n.hidden = true;
    const act = PREDICTED && PREDICTED.actions[m.name];
    if (act) { n.hidden = false; n.append('next ', g('actions', act), ' ' + word('actions', act)); }
    d.append(head, t, c, l, w, n); crew.appendChild(d);
  }
  $('order').textContent = v.order ? '“' + v.order + '”' : '(no order yet: the crew follow their temperaments)';
  countWords();
  const log = $('log');
  if (log.children.length !== receipts.length) {
    log.innerHTML = '';
    for (const r of receipts.slice().reverse()) { const li = document.createElement('li'); li.textContent = r; log.appendChild(li); }
    if (log.firstChild) log.firstChild.classList.add('fresh');
  }
}
function countWords() {
  if (!lastView) return;
  const words = $('move').value.trim().split(/\s+/).filter(Boolean).length;
  if (!words) { $('count').textContent = 'Empty: the standing order holds.'; return; }
  const cost = 1 + Math.floor(words / lastView.per_words);
  const over = words > lastView.max_words;
  $('count').textContent = words + ' / ' + lastView.max_words + ' words · costs ' + cost + ' ♦' +
      (over ? ' · too long' : (cost > lastView.points ? ' · not enough command' : ''));
}
$('move').addEventListener('input', countWords);

function render(state) {
  if (!LOOK && state.look) {
    LOOK = state.look; applyPalette();
    $('title').textContent = LOOK.title; $('tagline').textContent = LOOK.tagline;
  }
  renderMenu(state);
  const gm = state.game;
  if (!gm) { $('menu').hidden = false; return; }
  if (!gm.finished) $('menu').hidden = !menuOpen;
  const req = gm.request;
  mode = gm.view ? 'board' : 'plain';
  $('board').hidden = mode !== 'board'; $('plain').hidden = mode !== 'plain';
  if (gm.view) { lastView = gm.view; lastReceipts = gm.receipts; renderView(gm.view, gm.receipts); }
  else {
    const log = $('plainlog');
    if (log.children.length !== gm.receipts.length) {
      log.innerHTML = '';
      for (const r of gm.receipts.slice().reverse()) { const li = document.createElement('li'); li.textContent = r; log.appendChild(li); }
    }
    $('question').textContent = req ? req.question : '';
  }
  if (gm.finished) {
    const o = gm.outcome || {};
    $('status').textContent = 'Game over: ' + (o.winner ? 'won ' + stars(o.stars || 0) : 'not won') + (gm.error ? ' (' + gm.error + ')' : '');
    $('menu').hidden = false;
  } else if (req) {
    $('status').textContent = 'Your order, ' + gm.seat + '.';
  } else {
    $('status').textContent = 'The crew are at work…';
  }
  requestId = req ? req.id : null;
  $('context').textContent = req ? req.context + '\n\n' + req.question : '';
  $('reqerror').textContent = req && req.error ? 'Not accepted: ' + req.error : '';
  $('send').disabled = !req;
  if (req && req.question !== lastQuestion) {
    lastQuestion = req.question; PREDICTED = null;
    $('previewout').hidden = true; $('plainpreviewout').textContent = '';
  }
}
async function poll() {
  try { render(await api('api/state')); } catch (e) { $('status').textContent = 'Offline: ' + e; }
  setTimeout(poll, 1000);
}
async function doPreview() {
  const text = mode === 'board' ? $('move').value : $('plainmove').value;
  const r = await api('api/preview', {text: text || 'hold'});
  if (mode !== 'board') { $('plainpreviewout').textContent = 'If you send this: ' + r.summary; return; }
  const out = $('previewout'); out.hidden = false; out.innerHTML = '';
  out.append('If you send this' + (r.predicted ? ' (' + word('events', r.predicted.event) + '):' : ':'));
  PREDICTED = r.predicted;
  if (lastView) renderView(lastView, lastReceipts);
  const p = document.createElement('p'); p.className = 'meter'; p.textContent = r.summary; out.appendChild(p);
  if (r.forecast) { const f = document.createElement('p'); f.textContent = r.forecast; out.appendChild(f); }
}
async function send(text) {
  if (!requestId) return;
  $('status').textContent = 'Sent: ' + (text || 'hold');
  const r = await api('api/answer', {id: requestId, text: text || 'hold'});
  if (r.ok) { $('move').value = ''; $('plainmove').value = ''; countWords(); }
}
$('preview').onclick = doPreview; $('plainpreview').onclick = doPreview;
$('send').onclick = () => send(mode === 'board' ? $('move').value.trim() : $('plainmove').value.trim());
$('hold').onclick = () => send('hold'); $('plainpass').onclick = () => send('pass');
$('menuToggle').onclick = () => { menuOpen = !menuOpen; $('menu').hidden = !menuOpen; };
poll();
</script>
</body>
</html>
